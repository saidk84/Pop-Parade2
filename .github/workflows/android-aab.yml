name: Android V0.5 builds
on:
  push:
    branches: [v0.5]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/android-aab.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.ref_name == 'v0.5'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build debug APK and R8-optimized release bundle
        run: gradle -p android --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Verify game assets, version, APK signature, and R8 output
        run: |
          set -euo pipefail
          aab=android/app/build/outputs/bundle/release/app-release.aab
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          cmp index.html android/app/src/main/assets/index.html
          unzip -t "$aab"
          unzip -p "$aab" base/assets/index.html | cmp - index.html
          unzip -p "$apk" assets/index.html | cmp - index.html
          test -s android/app/build/outputs/mapping/release/mapping.txt
          "$tools/apksigner" verify "$apk"
          "$tools/aapt" dump badging "$apk" > apk-badging.txt
          grep -F "name='com.popparade.app' versionCode='6' versionName='0.5'" apk-badging.txt
          mkdir -p aab apk
          cp "$aab" aab/PopParade-v0.5-code6-unsigned.aab
          cp "$apk" apk/PopParade-v0.5-code6-debug.apk
          sha256sum aab/PopParade-v0.5-code6-unsigned.aab apk/PopParade-v0.5-code6-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PopParade-v0.5-code6-android
          if-no-files-found: error
          path: |
            aab/PopParade-v0.5-code6-unsigned.aab
            apk/PopParade-v0.5-code6-debug.apk
            android/app/build/outputs/mapping/release/mapping.txt
      - name: Save verified binaries to the V0.5 branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f aab/PopParade-v0.5-code6-unsigned.aab apk/PopParade-v0.5-code6-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m 'build: save verified Pop Parade V0.5 Android binaries'
            git push origin HEAD:v0.5
          fi
