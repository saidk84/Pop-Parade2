name: Android AAB release V0.3 (R8)
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-aab.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build optimized release app bundle with R8
        run: gradle -p android --no-daemon --stacktrace :app:bundleRelease
      - name: Validate Android App Bundle and R8 output
        run: |
          set -eu
          INPUT=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$INPUT"
          unzip -t "$INPUT" >/dev/null
          unzip -Z1 "$INPUT" | grep -q '^base/dex/classes.dex$'
          unzip -Z1 "$INPUT" | grep -q '^base/assets/index.html$'
          test -s android/app/build/outputs/mapping/release/mapping.txt
          mkdir -p aab
          cp "$INPUT" aab/PopParade-v0.3-unsigned.aab
          sha256sum aab/PopParade-v0.3-unsigned.aab
      - name: Upload unsigned AAB for secure offline signing
        uses: actions/upload-artifact@v4
        with:
          name: PopParade-v0.3-unsigned-aab
          path: aab/PopParade-v0.3-unsigned.aab
          if-no-files-found: error
      - name: Upload R8 mapping for crash debugging
        uses: actions/upload-artifact@v4
        with:
          name: PopParade-v0.3-r8-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
      - name: Save unsigned build in Git (signed bundle follows separately)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f aab/PopParade-v0.3-unsigned.aab
          git diff --cached --quiet || git commit -m 'build: verified R8-optimized V0.3 unsigned AAB [skip ci]'
          git push origin HEAD:main
