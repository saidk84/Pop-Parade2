name: Securely sign and save Pop Parade V0.3 AAB
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sign-android-aab.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure this release is not already signed
        run: |
          test -s aab/PopParade-v0.3-unsigned.aab
          if [ -e aab/PopParade-v0.3-play-upload.aab ]; then
            echo 'V0.3 already signed: refusing to create a different upload key.'
            exit 1
          fi
      - name: Generate private upload key and sign the AAB
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KEY_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$KEY_PASS"
          export KEY_PASS
          JKS="$RUNNER_TEMP/popparade-upload-v03.jks"
          keytool -genkeypair -keystore "$JKS" -storetype JKS -alias popparade-upload \
            -keyalg RSA -keysize 4096 -sigalg SHA256withRSA -validity 10000 \
            -dname "CN=Pop Parade Upload Key, O=Pop Parade" \
            -storepass "$KEY_PASS" -keypass "$KEY_PASS" -noprompt
          cp aab/PopParade-v0.3-unsigned.aab aab/PopParade-v0.3-play-upload.aab
          jarsigner -keystore "$JKS" -storepass "$KEY_PASS" -keypass "$KEY_PASS" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            aab/PopParade-v0.3-play-upload.aab popparade-upload
          jarsigner -verify aab/PopParade-v0.3-play-upload.aab
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          data = {
            'alias': 'popparade-upload',
            'keystoreType': 'JKS',
            'keystorePassword': os.environ['KEY_PASS'],
            'keyPassword': os.environ['KEY_PASS'],
            'keystoreBase64': base64.b64encode(
                (Path(os.environ['RUNNER_TEMP'])/'popparade-upload-v03.jks').read_bytes()
            ).decode('ascii'),
          }
          (Path(os.environ['RUNNER_TEMP'])/'pp-recovery.json').write_text(json.dumps(data))
          PY
          openssl cms -encrypt -aes256 -binary \
            -in "$RUNNER_TEMP/pp-recovery.json" -outform DER \
            -out aab/PopParade-v0.3-upload-key-recovery.p7m \
            play-store/upload-recovery-public.crt
          test -s aab/PopParade-v0.3-play-upload.aab
          test -s aab/PopParade-v0.3-upload-key-recovery.p7m
          keytool -list -v -keystore "$JKS" -storepass "$KEY_PASS" |
            grep 'SHA256:' > play-store/UPLOAD_CERT_FINGERPRINT.txt
          shred -u "$RUNNER_TEMP/pp-recovery.json" "$JKS" || rm -f "$RUNNER_TEMP/pp-recovery.json" "$JKS"
          sha256sum aab/PopParade-v0.3-play-upload.aab
      - name: Upload signed bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: PopParade-v0.3-play-upload-aab
          path: aab/PopParade-v0.3-play-upload.aab
          if-no-files-found: error
      - name: Upload encrypted private signing-key recovery
        uses: actions/upload-artifact@v4
        with:
          name: PopParade-v0.3-encrypted-key-recovery
          path: aab/PopParade-v0.3-upload-key-recovery.p7m
          if-no-files-found: error
      - name: Commit signed AAB and encrypted recovery (never private keys)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f aab/PopParade-v0.3-play-upload.aab aab/PopParade-v0.3-upload-key-recovery.p7m
          git add play-store/UPLOAD_CERT_FINGERPRINT.txt
          git commit -m 'release: V0.3 Google Play signed AAB + encrypted upload-key backup [skip ci]'
          git push origin HEAD:main
