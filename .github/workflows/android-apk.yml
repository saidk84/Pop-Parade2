name: Android APK v0.2

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 35
        run: |
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${PATH}"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build signed debug APK
        run: gradle -p android --no-daemon --stacktrace assembleDebug
      - name: Copy APK with versioned name
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/PopParade-v0.2-debug.apk
          test -s apk/PopParade-v0.2-debug.apk
      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PopParade-v0.2-debug
          path: apk/PopParade-v0.2-debug.apk
          if-no-files-found: error
      - name: Save APK binary to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f apk/PopParade-v0.2-debug.apk
          git commit -m 'build: save V0.2 Android APK [skip ci]'
          git push origin HEAD:main
