plugins {
    id 'com.android.application'
}
android {
    namespace 'com.popparade.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.popparade.app'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '0.3'
    }
    buildTypes {
        debug { minifyEnabled false }
        release {
            // Optimize native Java bytecode and Android resources with R8.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
